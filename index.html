<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spilhuset · PS5</title><style>html{background:#090b1b;color:#f4f3ff;font-family:system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 70% 10%,#27214a,transparent 45%),#090b1b}main{width:min(1100px,100%)}h1{font-size:clamp(48px,7vw,90px);margin:0;color:#fff}p{color:#b7b3d2;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:35px 0}.tile{display:flex;flex-direction:column;justify-content:center;min-height:160px;border:2px solid #5b567c;border-radius:24px;padding:24px;text-decoration:none;color:#fff;font-size:clamp(24px,3vw,38px);font-weight:800;background:#1a1b34;transition:.15s}.tile small{font-size:16px;color:#c7c2dc;margin-top:12px}.tile:hover,.tile:focus,.tile.selected{outline:4px solid #a494ff;outline-offset:3px;background:#383063}footer{font-size:16px;color:#aaa5c4}@media(max-width:650px){.grid{grid-template-columns:1fr}.tile{min-height:100px}}</style><main><h1>🎮 Spilhuset</h1><p>Vælg et spil med controlleren, eller klik med musen.</p><div class="grid"><a class="tile selected" href="bloodgate.html">Bloodgate<small>Action og eventyr</small></a><a class="tile" href="echoes.html">Echoes of Ther<small>Udforsk og overlev</small></a><a class="tile" href="rumspil.html">Cyber Pulse<small>Rumspillet</small></a><a class="tile" href="skydespil.html">Tank Arena<small>Skydespillet</small></a></div><footer>D-pad / venstre stik: vælg spil · X: spil</footer></main><script>let i=0,last=false,ms=0;let a=[...document.querySelectorAll('.tile')];function sel(n){a[i].classList.remove('selected');i=(n+a.length)%a.length;a[i].classList.add('selected');a[i].focus({preventScroll:true})}function poll(t){let g=navigator.getGamepads?.().find(x=>x?.connected);if(g){let b=g.buttons,ax=g.axes,d=b[13]?.pressed||ax[1]>.5,r=b[15]?.pressed||ax[0]>.5,up=b[12]?.pressed||ax[1]<-.5,l=b[14]?.pressed||ax[0]<-.5;if(t-ms>210){if(d||r){sel(i+1);ms=t}else if(up||l){sel(i-1);ms=t}}let x=b[0]?.pressed;if(x&&!last)a[i].click();last=x}requestAnimationFrame(poll)}requestAnimationFrame(poll);document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight'].includes(e.key)){e.preventDefault();sel(i+1)}else if(['ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();sel(i-1)}else if(e.key==='Enter'){a[i].click()}})</script></html>
